<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif">
  <!--
    Source of public/og-image.png (the preview card shown when the link is shared on Discord, WhatsApp, X...).
    To regenerate: open this file in Chrome with a 1200x630 viewport and save a screenshot as public/og-image.png.
    Keep the texts in sync with the hero of index.html.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3250" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#fondo)" />

  <text x="80" y="112" font-size="24" font-weight="600" letter-spacing="3" fill="#a3c4e8">COMUNIDAD STEAM ARGENTINA · LANZAMIENTOS DE LA SEMANA</text>

  <text font-size="96" font-weight="800" letter-spacing="-2" fill="#ffffff">
    <tspan x="80" y="262">Sumá tu juego a</tspan>
    <tspan x="80" y="364">los lanzamientos</tspan>
    <tspan x="80" y="466"><tspan fill="#fbbf24">argentinos</tspan> en Steam</tspan>
  </text>

  <text x="80" y="540" font-size="30" fill="#cbd5e1">Cargá tu juego en el formulario y lo sumamos al próximo anuncio.</text>
  <text x="80" y="584" font-size="24" fill="#64748b">freddre.github.io/formulario-devs-arg</text>
</svg>
